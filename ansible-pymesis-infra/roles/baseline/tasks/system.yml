---
- name: Instalar QEMU Guest Agent
  ansible.builtin.package:
    name: qemu-guest-agent
    state: present
    update_cache: true
  when: proxmox_vmtype != "lxc"

- name: Asegurar que QEMU Guest Agent esté activo
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: proxmox_vmtype != "lxc"

- name: Configurar timezone
  community.general.timezone:
    name: "{{ target_timezone }}"

- name: Verificar que el usuario sadmin exista
  ansible.builtin.user:
    name: "{{ sadmin_user }}"
    state: present
    shell: /bin/bash
