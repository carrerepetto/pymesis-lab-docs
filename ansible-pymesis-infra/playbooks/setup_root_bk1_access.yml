---
- name: Dar a root acceso SSH hacia bk1 (para restic vía become)
  hosts: hr1,n8n1,es1,odoo2,glpi1,rhel1
  become: true
  tasks:
    - name: Asegurar directorio /root/.ssh
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: '0700'

    - name: Generar keypair ed25519 para root (si no existe)
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -C "root@{{ inventory_hostname }}-restic"
        -f /root/.ssh/id_ed25519 -N ""
      args:
        creates: /root/.ssh/id_ed25519

    - name: Leer clave pública de root
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: root_pubkey

    - name: Verificar si bk1 ya está en known_hosts de root
      ansible.builtin.command: ssh-keygen -F bk1 -f /root/.ssh/known_hosts
      register: known_hosts_check
      failed_when: false
      changed_when: false

    - name: Agregar bk1 a known_hosts de root (si falta)
      ansible.builtin.shell: "ssh-keyscan -H bk1 >> /root/.ssh/known_hosts"
      when: known_hosts_check.rc != 0

    - name: Asegurar BatchMode para bk1 en config SSH de root
      ansible.builtin.blockinfile:
        path: /root/.ssh/config
        create: true
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - bk1"
        block: |
          Host bk1
              BatchMode yes

    - name: Autorizar la clave de root en bk1 (como sadmin)
      delegate_to: bk1
      become: false
      ansible.posix.authorized_key:
        user: sadmin
        key: "{{ root_pubkey.content | b64decode }}"
        state: present
