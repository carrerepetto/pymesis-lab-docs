---
- name: Aplicar secretos vaulteados a es1
  hosts: es1
  gather_facts: false
  vars:
    compose_file: /home/sadmin/docker/es1/docker-compose.yml
  tasks:
    - name: Setear POSTGRES_PASSWORD (servicio postgres)
      ansible.builtin.lineinfile:
        path: "{{ compose_file }}"
        regexp: '^(\s*POSTGRES_PASSWORD:\s*).*'
        line: "\\1{{ vault_medusa_postgres_password }}"
        backrefs: true
      notify: recreate containers

    - name: Setear password embebido en DATABASE_URL (servicio backend)
      ansible.builtin.lineinfile:
        path: "{{ compose_file }}"
        regexp: '^(\s*DATABASE_URL:\s*postgres://medusa:).*(@postgres:5432/medusa_db)'
        line: "\\1{{ vault_medusa_postgres_password }}\\2"
        backrefs: true
      notify: recreate containers

    - name: Setear JWT_SECRET (servicio backend)
      ansible.builtin.lineinfile:
        path: "{{ compose_file }}"
        regexp: '^(\s*JWT_SECRET:\s*).*'
        line: "\\1{{ vault_medusa_jwt_secret }}"
        backrefs: true
      notify: recreate containers

    - name: Setear COOKIE_SECRET (servicio backend)
      ansible.builtin.lineinfile:
        path: "{{ compose_file }}"
        regexp: '^(\s*COOKIE_SECRET:\s*).*'
        line: "\\1{{ vault_medusa_cookie_secret }}"
        backrefs: true
      notify: recreate containers

  handlers:
    - name: recreate containers
      ansible.builtin.command: "docker compose -f {{ compose_file }} up -d"
      args:
        chdir: /home/sadmin/docker/es1
