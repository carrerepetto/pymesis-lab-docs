---
- name: Aplicar secretos vaulteados a odoo2
  hosts: odoo2
  gather_facts: false
  tasks:
    - name: Setear db_password en odoo18.conf (activo)
      ansible.builtin.lineinfile:
        path: /etc/odoo18.conf
        regexp: '^db_password\s*='
        line: "db_password = {{ vault_odoo18_db_password }}"
      notify: restart odoo18

    - name: Setear admin_passwd en odoo18.conf (activo)
      ansible.builtin.lineinfile:
        path: /etc/odoo18.conf
        regexp: '^admin_passwd\s*='
        line: "admin_passwd = {{ vault_odoo18_admin_passwd }}"
      notify: restart odoo18

    - name: Setear db_password en odoo17.conf (decomisionado, sin reiniciar)
      ansible.builtin.lineinfile:
        path: /etc/odoo17.conf
        regexp: '^db_password\s*='
        line: "db_password = {{ vault_odoo17_db_password }}"

    - name: Setear admin_passwd en odoo17.conf (decomisionado, sin reiniciar)
      ansible.builtin.lineinfile:
        path: /etc/odoo17.conf
        regexp: '^admin_passwd\s*='
        line: "admin_passwd = {{ vault_odoo17_admin_passwd }}"

  handlers:
    - name: restart odoo18
      ansible.builtin.systemd:
        name: odoo18
        state: restarted
