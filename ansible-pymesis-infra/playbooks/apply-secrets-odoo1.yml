---
- name: Aplicar secretos vaulteados a odoo1
  hosts: odoo1
  gather_facts: false
  tasks:
    - name: Setear db_password en odoo.conf
      ansible.builtin.lineinfile:
        path: /etc/odoo/odoo.conf
        regexp: '^db_password\s*='
        line: "db_password = {{ vault_odoo1_db_password }}"
      notify: restart odoo

    - name: Setear admin_passwd en odoo.conf
      ansible.builtin.lineinfile:
        path: /etc/odoo/odoo.conf
        regexp: '^admin_passwd\s*='
        line: "admin_passwd = {{ vault_odoo1_admin_passwd }}"
      notify: restart odoo

  handlers:
    - name: restart odoo
      ansible.builtin.systemd:
        name: odoo
        state: restarted
