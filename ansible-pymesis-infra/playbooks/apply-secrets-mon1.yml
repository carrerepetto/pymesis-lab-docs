---
- name: Aplicar secretos vaulteados a mon1
  hosts: mon1
  gather_facts: false
  tasks:
    - name: Setear bind_password en ldap.toml
      ansible.builtin.lineinfile:
        path: /etc/grafana/ldap.toml
        regexp: "^bind_password\\s*="
        line: "bind_password = '{{ vault_grafana_ldap_bind_password }}'"
      notify: restart grafana

  handlers:
    - name: restart grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
