---
- name: Run audit on Linux hosts
  hosts: all:!windows:!firewall:!client
  gather_facts: false
  tasks:
    - name: Define audit output file path
      ansible.builtin.set_fact:
        audit_file: "/tmp/secrets_audit_{{ inventory_hostname }}.txt"
    - name: Search common secret patterns
      ansible.builtin.shell: >
        grep -rlEI "password\s*=|token\s*=|secret\s*=|api[_-]?key\s*="
        /etc /opt /home 2>/dev/null | grep -v '\.git' | grep -v "{{ audit_file }}"
      register: grep_result
      changed_when: false
      failed_when: false
    - name: Save results on remote host
      ansible.builtin.copy:
        content: "{{ grep_result.stdout if grep_result.stdout is defined else '' }}"
        dest: "{{ audit_file }}"

- name: Fetch Linux audit files
  hosts: all:!windows:!firewall:!client
  gather_facts: false
  tasks:
    - name: Fetch from remote
      ansible.builtin.fetch:
        src: "/tmp/secrets_audit_{{ inventory_hostname }}.txt"
        dest: "/tmp/secrets_audit/"
        flat: yes

- name: Run and fetch audit on Windows hosts
  hosts: windows
  gather_facts: false
  tasks:
    - name: Ensure C:\Temp exists
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Search common secret patterns
      ansible.windows.win_shell: >
        Get-ChildItem -Path C:\ -Recurse -Include *.txt,*.config,*.xml,*.ps1,*.ini
        -ErrorAction SilentlyContinue |
        Where-Object { $_.FullName -ne 'C:\Temp\audit.txt' } |
        Select-String -Pattern 'password\s*=|token\s*=|secret\s*='
      register: win_grep_result
      changed_when: false
      failed_when: false

    - name: Save results on remote host
      ansible.windows.win_copy:
        content: "{{ win_grep_result.stdout if win_grep_result.stdout is defined else '' }}"
        dest: C:\Temp\audit.txt

    - name: Fetch audit.txt from Windows hosts
      ansible.builtin.fetch:
        src: "C:\\Temp\\audit.txt"
        dest: "/tmp/secrets_audit/{{ inventory_hostname }}_audit.txt"
        flat: yes

- name: Consolidate all audit files
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Concatenate into one report
      ansible.builtin.shell: cat /tmp/secrets_audit/* > /tmp/audit_consolidado.txt
      args:
        executable: /bin/bash
    - name: Show path
      ansible.builtin.debug:
        msg: "Consolidado en /tmp/audit_consolidado.txt"
